name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # check:node targets Node's own vm, which Bun cannot stand in for.
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
      - run: bun run verify
      - run: sh scripts/check-pack.sh

  live:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:live
        env:
          YTDL_COOKIE: ${{ secrets.YTDL_COOKIE }}
          YTDL_HOST: github-actions
