name: Publish
# Tag a verified commit with its package.json version (for example `5.0.0`). CI verifies, packs and
# publishes it with provenance through npm trusted publishing; a prerelease goes to the `next` tag.
# Trusted publishing cannot run `npm deprecate`, so a maintainer deprecates an old major by hand with 2FA.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
jobs:
  publish:
    name: Verify, pack and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm publish is the only publisher that supports --provenance (oven-sh/bun#15601).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [[ "$TAG" != "$version" ]]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run verify

      - run: sh scripts/check-pack.sh

      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public --tag next
          else
            npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public
          fi

  docs:
    name: Publish versioned docs
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: actions/checkout@v5
        with:
          repository: distubejs/distubejs.github.io
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: site

      - run: bun install --frozen-lockfile
        working-directory: site

      - run: bun site/scripts/snapshot.ts . site/snapshots --docs docs

      - name: Commit and push
        working-directory: site
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$TAG"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          git push
