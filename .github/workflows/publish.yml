name: Publish
# Tag the release commit `chore(Release): <version>` with its version (for example `5.0.0`). CI checks
# that commit, verifies, packs and publishes it with provenance through npm trusted publishing, then creates
# the GitHub release. A prerelease goes to the npm `next` tag and is marked prerelease on GitHub.
# Trusted publishing cannot run `npm deprecate`, so a maintainer deprecates an old major by hand with 2FA.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
jobs:
  publish:
    name: Verify, pack and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # npm publish is the only publisher that supports --provenance (oven-sh/bun#15601).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bun -e 'console.log((await Bun.file("package.json").json()).version)')"
          if [[ "$TAG" != "$version" ]]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Check the tag is on its release commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          fail() { echo "Tag $TAG is not on its release commit: $1" >&2; exit 1; }
          [[ "$(git log -1 --format=%s)" == "chore(Release): $TAG" ]] || fail "the subject is not 'chore(Release): $TAG'"
          [[ "$(git rev-list --parents -n 1 HEAD | wc -w)" == 2 ]] || fail "it does not have exactly one parent"
          [[ "$(git diff --name-only HEAD^ HEAD)" == "package.json" ]] || fail "it changes files other than package.json"
          git show HEAD^:package.json > "$RUNNER_TEMP/before.json"
          bun -e '
            const [before, after] = await Promise.all(process.argv.slice(1).map((path) => Bun.file(path).json()));
            const rest = (manifest) => JSON.stringify({ ...manifest, version: undefined });
            process.exit(rest(before) === rest(after) && before.version !== after.version ? 0 : 1);
          ' "$RUNNER_TEMP/before.json" package.json || fail "package.json changes more than its version"

      - run: bun install --frozen-lockfile

      - run: bun run verify

      - run: sh scripts/check-pack.sh

      - run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public --tag next
          else
            npm publish "$RUNNER_TEMP"/*.tgz --provenance --access public
          fi

  docs:
    name: Publish versioned docs
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - run: bun run build

      - uses: actions/checkout@v5
        with:
          repository: distubejs/distubejs.github.io
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
          path: site

      - run: bun install --frozen-lockfile
        working-directory: site

      - run: bun site/scripts/snapshot.ts . site/snapshots --docs docs

      - name: Commit and push
        working-directory: site
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "$TAG"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          git push

  release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Release with notes since the previous tag
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match '[0-9]*' HEAD^ 2>/dev/null || true)"
          git log --no-merges --format='%h%x09%s' "${previous:+$previous..}HEAD" | awk -F '\t' '
            BEGIN {
              count = split("breaking feat fix perf refactor docs test build other", order, " ")
              title["breaking"] = "Breaking changes"; title["feat"] = "Features"; title["fix"] = "Fixes"
              title["perf"] = "Performance"; title["refactor"] = "Refactoring"; title["docs"] = "Documentation"
              title["test"] = "Tests"; title["build"] = "Build and CI"; title["other"] = "Other changes"
            }
            $2 ~ /^chore\(Release\):/ { next }
            {
              type = "other"
              if (match($2, /^[a-z]+(\([^)]*\))?!?:/)) {
                head = substr($2, 1, RLENGTH)
                if (head ~ /!:$/) type = "breaking"
                else { sub(/[(:].*/, "", head); if (head == "ci") head = "build"; if (head in title) type = head }
              }
              items[type] = items[type] "- " $2 " (" $1 ")\n"
            }
            END { for (i = 1; i <= count; i++) if (order[i] in items) printf "### %s\n\n%s\n", title[order[i]], items[order[i]] }
          ' > "$RUNNER_TEMP/notes.md"
          args=(--verify-tag --title "$TAG" --generate-notes --notes "$(cat "$RUNNER_TEMP/notes.md")")
          if [[ -n "$previous" ]]; then args+=(--notes-start-tag "$previous"); fi
          if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
